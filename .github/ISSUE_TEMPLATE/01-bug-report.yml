name: Bug report
description: Report a defect in plugin behavior, tooling, or workflows.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: input
    id: area
    attributes:
      label: Affected area
      description: Name the feature, file, or workflow involved.
      placeholder: guest authors, REST API, CI workflow
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction details
      description: Include WordPress version, PHP version, commands, logs, or screenshots.
